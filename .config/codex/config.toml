personality = "pragmatic"
approval_policy = "on-request"
web_search = "cached"
model = "gpt-5.6-sol"
model_reasoning_effort = "medium"

[analytics]
enabled = false

[shell_environment_policy]
include_only = ["PATH", "HOME", "SHELL", "LC_ALL", "EDITOR", "DIRENV_DIR", "DIRENV_FILE"]

[tui]
status_line = [
  "model-with-reasoning",
  "current-dir",
  "context-used",
  "five-hour-limit",
  "weekly-limit",
]
status_line_use_colors = true

[desktop]
keepRemoteControlAwakeWhilePluggedIn = false
git-show-sidebar-pr-icons = true
followUpQueueMode = "queue"
preventSleepWhileRunning = true
dock-icon-preference = "codex-system"
conversationDetailMode = "STEPS_COMMANDS"
hotkey-window-projectless-default-enabled = true
show-context-window-usage = true
enabled-reasoning-efforts = ["medium", "high", "xhigh"]
open-link-in-target-preference = "in-app-browser"

[desktop.open-in-target-preferences]
global = "zed"

# MCP Servers

[mcp_servers.plane]
enabled = false
url = "https://mcp.plane.so/http/mcp"

[mcp_servers.github]
enabled = false
url = "https://api.githubcopilot.com/mcp/"
bearer_token_env_var = "GITHUB_TOKEN"

[mcp_servers.context7]
enabled = true
url = "https://mcp.context7.com/mcp"
env_http_headers = { "CONTEXT7_API_KEY" = "CONTEXT7_API_KEY" }

[mcp_servers.posthog]
enabled = false
command = "bun"
args = ["x", "mcp-remote@latest", "https://mcp-eu.posthog.com/mcp"]

[mcp_servers.kaneo]
command = "npx"
args = ["--yes", "@kaneo/mcp", "serve", "--api-url", "https://kaneo.biasi.info"]
