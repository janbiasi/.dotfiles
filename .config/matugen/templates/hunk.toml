theme = "custom"

[custom_theme]
base = "github-dark-default"
label = "Matugen"
background = "{{colors.surface.default.hex}}"
panel = "{{colors.surface_container_low.default.hex}}"
panelAlt = "{{colors.surface_container.default.hex}}"
border = "{{colors.outline_variant.default.hex}}"
accent = "{{colors.primary.default.hex}}"
accentMuted = "{{colors.primary.default.hex | to_color | set_lightness: 28.0}}"
text = "{{colors.on_surface.default.hex}}"
muted = "{{colors.on_surface_variant.default.hex}}"
addedBg = "{{colors.success.default.hex | to_color | set_lightness: 16.0}}"
removedBg = "{{colors.error.default.hex | to_color | set_lightness: 16.0}}"
addedContentBg = "{{colors.success.default.hex | to_color | set_lightness: 22.0}}"
removedContentBg = "{{colors.error.default.hex | to_color | set_lightness: 22.0}}"
contextBg = "{{colors.surface.default.hex}}"
contextContentBg = "{{colors.surface.default.hex}}"
addedSignColor = "{{colors.success.default.hex}}"
removedSignColor = "{{colors.error.default.hex}}"
lineNumberBg = "{{colors.surface_container_low.default.hex}}"
lineNumberFg = "{{colors.on_surface_variant.default.hex}}"
selectedHunk = "{{colors.primary.default.hex | to_color | set_lightness: 25.0}}"
badgeAdded = "{{colors.success.default.hex}}"
badgeRemoved = "{{colors.error.default.hex}}"
badgeNeutral = "{{colors.secondary.default.hex}}"
fileNew = "{{colors.success.default.hex}}"
fileDeleted = "{{colors.error.default.hex}}"
fileRenamed = "{{colors.tertiary.default.hex}}"
fileModified = "{{colors.primary.default.hex}}"
fileUntracked = "{{colors.secondary.default.hex}}"
noteBorder = "{{colors.tertiary.default.hex}}"
noteBackground = "{{colors.surface_container.default.hex}}"
noteTitleBackground = "{{colors.tertiary_container.default.hex}}"
noteTitleText = "{{colors.on_tertiary_container.default.hex}}"

[custom_theme.syntax_scopes]
"comment" = "{{colors.on_surface_variant.default.hex}}"
"punctuation.definition.comment" = "{{colors.on_surface_variant.default.hex}}"
"keyword" = "{{colors.secondary.default.hex}}"
"storage.type" = "{{colors.secondary.default.hex}}"
"string" = "{{colors.success.default.hex}}"
"constant.numeric" = "{{colors.tertiary.default.hex}}"
"entity.name.function" = "{{colors.primary.default.hex}}"
