general {
    hide_cursor = true
}

auth {
    fingerprint:enabled = true
    fingerprint:ready_message = Touch fingerprint sensor to unlock
    fingerprint:present_message = Reading fingerprint…
    fingerprint:retry_delay = 750
}

background {
    monitor =
    path = screenshot
    blur_size = 8
    blur_passes = 3
    noise = 0.02
    contrast = 0.9
    brightness = 0.55
    vibrancy = 0.2
    vibrancy_darkness = 0.1
}

input-field {
    monitor =
    size = 460, 72
    outline_thickness = 2
    outer_color = rgba({{colors.primary.default.hex_stripped}}ee)
    inner_color = rgba({{colors.surface.default.hex_stripped}}a6)
    font_color = rgb({{colors.on_surface.default.hex_stripped}})
    check_color = rgba({{colors.primary.default.hex_stripped}}ee)
    fail_color = rgba({{colors.error.default.hex_stripped}}ee)
    rounding = 12
    fade_on_empty = false
    placeholder_text = Password
    position = 0, 0
    halign = center
    valign = center
}

label {
    monitor =
    text = <b>$TIME</b>
    color = rgb({{colors.on_surface.default.hex_stripped}})
    font_size = 200
    position = 0, -240
    halign = center
    valign = top
}

label {
    monitor =
    text = 󰬔  $FPRINTPROMPT$FPRINTFAIL
    color = rgb({{colors.on_surface_variant.default.hex_stripped}})
    font_family = JetBrainsMono Nerd Font Propo
    font_size = 18
    position = 0, -82
    halign = center
    valign = center
}

shape {
    monitor =
    size = 64, 64
    color = rgba({{colors.primary_container.default.hex_stripped}}99)
    rounding = -1
    border_size = 1
    border_color = rgba({{colors.primary.default.hex_stripped}}cc)
    onclick = systemctl reboot
    position = -88, 72
    halign = center
    valign = bottom
}

shape {
    monitor =
    size = 64, 64
    color = rgba({{colors.error_container.default.hex_stripped}}99)
    rounding = -1
    border_size = 1
    border_color = rgba({{colors.error.default.hex_stripped}}cc)
    onclick = systemctl poweroff
    position = 0, 72
    halign = center
    valign = bottom
}

shape {
    monitor =
    size = 64, 64
    color = rgba({{colors.secondary_container.default.hex_stripped}}99)
    rounding = -1
    border_size = 1
    border_color = rgba({{colors.on_surface_variant.default.hex_stripped}}cc)
    onclick = systemctl hibernate
    position = 88, 72
    halign = center
    valign = bottom
}

label {
    monitor =
    text = 󰜉
    color = rgb({{colors.on_surface.default.hex_stripped}})
    font_family = JetBrainsMono Nerd Font Propo
    font_size = 30
    onclick = systemctl reboot
    position = -88, 79
    halign = center
    valign = bottom
    zindex = 1
}

label {
    monitor =
    text = 󰐥
    color = rgb({{colors.on_surface.default.hex_stripped}})
    font_family = JetBrainsMono Nerd Font Propo
    font_size = 30
    onclick = systemctl poweroff
    position = 0, 79
    halign = center
    valign = bottom
    zindex = 1
}

label {
    monitor =
    text = 󰒲
    color = rgb({{colors.on_surface.default.hex_stripped}})
    font_family = JetBrainsMono Nerd Font Propo
    font_size = 30
    onclick = systemctl hibernate
    position = 88, 76
    halign = center
    valign = bottom
    zindex = 1
}
